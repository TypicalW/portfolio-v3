<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Ashmit Mishra{% endblock %}</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/favicon.png') }}"
    >

    <!-- Old huge chunky CSS file 
        <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    > -->
            <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/projects.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/about.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/socials.css') }}">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    >
</head>

<body>

    <!-- Navigation -->
    <header class="site-header">
        <nav class="navbar container">

           <div class="navbar-logo">
                <a href="/" class="home-symbol">~</a>

                {% if request.path == "/" %}
                    <span>/</span>
                {% else %}
                    <span>{{ request.path }}</span>
                {% endif %}

                <span class="terminal-cursor"></span>
            </div>

            <div class="navbar-links">
                <a href="/about/">About</a>
                <a href="/projects/">Projects</a>

                <a
                    href="{{ url_for('static', filename='documents/resume.pdf') }}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Resume
                </a>
                <a href="{{ url_for('socials') }}">Socials</a>
            </div>

        </nav>
    </header>


    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="site-footer container">

        <div class="footer-left">
            <p>© 2026 Ashmit Mishra</p>
        </div>

        <div class="footer-right">

            <!-- Time -->
            <span class="footer-time">

                <span class="clock-icon">
                    <span class="clock-hand hour"></span>
                    <span class="clock-hand minute"></span>
                </span>

                <span>0:00:00</span>

            </span>


            <!-- Views -->
            <span class="footer-views">
                {{ total_views }} views
            </span>


            <!-- GitHub -->
            <a
                href="{{ socials.github }}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
            >
                <span>Github</span>
                <i class="fa-brands fa-github"></i>
            </a>


            <!-- LinkedIn -->
            <a
                href="{{ socials.linkedin }}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
            >
                <span>Linkedin</span>
                <i class="fa-brands fa-linkedin"></i>
            </a>


            <!-- Codeforces -->
            <a
                href="{{ socials.codeforces }}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Codeforces"
            >
                <span>CodeForces</span>
                <i class="fa-solid fa-code"></i>
            </a>

        </div>

    </footer>
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
</body>

</html>
