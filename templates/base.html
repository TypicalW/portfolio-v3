<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Ashmit Mishra{% endblock %}</title>

    <link rel="icon" type="image/png" href="/static/images/favicon.png">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <!-- Navigation -->
    <header class="site-header">
        <nav class="navbar container">

            <div class="navbar-logo">
                <a href="/" class="home-symbol">~</a>
                <span>/</span>
            </div>

            <div class="navbar-links">
                <a href="/about/">About</a>
                <a href="/projects/">Projects</a>
                <a href="/resume/" target="_blank">Resume</a>
            </div>

        </nav>
    </header>


    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="site-footer container">

        <div class="footer-left">
            <p>© 2026 Ashmit Mishra</p>
        </div>

        <div class="footer-right">

            <span class="footer-time">
                <span class="clock-icon">
                    <span class="clock-hand hour"></span>
                    <span class="clock-hand minute"></span>
                </span>

                <span>0:00:00</span>
            </span>

            <span class="footer-views">
                0 views
            </span>

            <a href="#" target="_blank" aria-label="GitHub">
                <span>Github</span>
                <i class="fa-brands fa-github"></i>
            </a>

            <a href="#" target="_blank" aria-label="LinkedIn">
                <span>Linkedin</span>
                <i class="fa-brands fa-linkedin"></i>
            </a>

            <a href="#" target="_blank" aria-label="Codeforces">
                <span>CodeForces</span>
                <i class="fa-solid fa-code"></i>
            </a>

        </div>

    </footer>

</body>

</html>
